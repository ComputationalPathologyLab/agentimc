<svg width="1200" height="1850" viewBox="0 0 1200 1850" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F3EA"/>
      <stop offset="1" stop-color="#EEF4F1"/>
    </linearGradient>
    <linearGradient id="header" x1="120" y1="70" x2="1080" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F3D3E"/>
      <stop offset="1" stop-color="#1E6F5C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16312E" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10V0Z" fill="#557C6D"/>
    </marker>
    <style>
      text { font-family: "Avenir Next", "Segoe UI", Arial, sans-serif; fill: #18312E; }
      .title { font-size: 34px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #DCECE6; }
      .section-title { font-size: 24px; font-weight: 700; }
      .section-note { font-size: 15px; fill: #4C635D; }
      .step-title { font-size: 21px; font-weight: 700; }
      .step-body { font-size: 16px; fill: #39534C; }
      .badge { font-size: 16px; font-weight: 700; fill: #0F3D3E; }
      .tiny { font-size: 14px; fill: #536C66; }
    </style>
  </defs>

  <rect width="1200" height="1850" fill="url(#bg)"/>

  <rect x="120" y="42" width="960" height="118" rx="28" fill="url(#header)" filter="url(#shadow)"/>
  <text x="160" y="95" class="title">Data Analysis Workflow</text>
  <text x="160" y="130" class="subtitle">A simplified map of what happens after Imaging Mass Cytometry acquisition</text>

  <rect x="100" y="200" width="1000" height="1520" rx="34" fill="#FFFFFF" fill-opacity="0.72" stroke="#D3E1DA"/>

  <rect x="150" y="250" width="900" height="210" rx="28" fill="#E8F1ED" stroke="#BED2CA"/>
  <circle cx="210" cy="310" r="34" fill="#D6E7DF"/>
  <text x="196" y="317" class="badge">1</text>
  <text x="270" y="304" class="step-title">Preprocess the raw IMC data</text>
  <text x="270" y="338" class="step-body">Start with raw `.mcd` image files.</text>
  <text x="270" y="364" class="step-body">Use Steinbock to clean the images, remove hot pixels, segment cells with</text>
  <text x="270" y="388" class="step-body">MESMER, and extract marker intensities for each individual cell.</text>
  <text x="270" y="426" class="tiny">Output: one table where each row is a cell and each column is a measured feature.</text>

  <line x1="600" y1="460" x2="600" y2="510" stroke="#557C6D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="150" y="520" width="900" height="210" rx="28" fill="#F7F0E2" stroke="#E2D2B2"/>
  <circle cx="210" cy="580" r="34" fill="#F0DFC0"/>
  <text x="196" y="587" class="badge">2</text>
  <text x="270" y="574" class="step-title">Clean and normalize the cell data</text>
  <text x="270" y="608" class="step-body">Remove tiny likely-artifact cells, cap extreme marker values, apply arcsinh</text>
  <text x="270" y="632" class="step-body">transformation, and normalize protein abundance per cell with CLR.</text>
  <text x="270" y="670" class="step-body">This makes cells more comparable across images and patients.</text>
  <text x="270" y="698" class="tiny">Output: a cleaner single-cell dataset ready for interpretation.</text>

  <line x1="600" y1="730" x2="600" y2="780" stroke="#557C6D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="150" y="790" width="900" height="230" rx="28" fill="#EAF0F9" stroke="#C4D2EA"/>
  <circle cx="210" cy="850" r="34" fill="#D5E1F4"/>
  <text x="196" y="857" class="badge">3</text>
  <text x="270" y="844" class="step-title">Add spatial context from the tissue</text>
  <text x="270" y="878" class="step-body">Manually annotate bone on neighboring H&amp;E sections, then calculate how far</text>
  <text x="270" y="902" class="step-body">each cell is from the nearest bone surface.</text>
  <text x="270" y="940" class="step-body">Visually inspect the images, mark blur or staining artifacts, and exclude cells in</text>
  <text x="270" y="964" class="step-body">those bad regions.</text>
  <text x="270" y="992" class="tiny">Output: each cell now has both biology and location.</text>

  <line x1="600" y1="1020" x2="600" y2="1070" stroke="#557C6D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="150" y="1080" width="900" height="250" rx="28" fill="#F3EAF4" stroke="#D8C3DC"/>
  <circle cx="210" cy="1140" r="34" fill="#E4D7E7"/>
  <text x="196" y="1147" class="badge">4</text>
  <text x="270" y="1134" class="step-title">Decide what each cell is</text>
  <text x="270" y="1168" class="step-body">Batch-correct the data, create expert-guided ground-truth labels with SCIMAP,</text>
  <text x="270" y="1192" class="step-body">and train an XGBoost model to assign cell types to the remaining cells.</text>
  <text x="270" y="1230" class="step-body">Refine difficult labels with FlowSOM and marker rules, then visually check the</text>
  <text x="270" y="1254" class="step-body">final annotations on top of the images.</text>
  <text x="270" y="1282" class="tiny">Output: plasma cells, macrophages, T cells, and other cell types are identified.</text>

  <line x1="600" y1="1330" x2="600" y2="1380" stroke="#557C6D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="150" y="1390" width="900" height="230" rx="28" fill="#E7F3F2" stroke="#B8D9D5"/>
  <circle cx="210" cy="1450" r="34" fill="#CFE6E3"/>
  <text x="196" y="1457" class="badge">5</text>
  <text x="270" y="1444" class="step-title">Find tissue neighborhoods and cell interactions</text>
  <text x="270" y="1478" class="step-body">Use CellCharter to group nearby cells into spatial neighborhoods based on marker</text>
  <text x="270" y="1502" class="step-body">patterns and local context, not only by cell-type labels.</text>
  <text x="270" y="1540" class="step-body">Then measure neighborhood enrichment, aggregation, directional neighbor</text>
  <text x="270" y="1564" class="step-body">preferences with COZI, and the abundance of nearby cell types.</text>
  <text x="270" y="1592" class="tiny">Output: a map of who sits near whom, where, and in what kind of microenvironment.</text>

  <line x1="600" y1="1620" x2="600" y2="1670" stroke="#557C6D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="150" y="1680" width="900" height="210" rx="28" fill="#FFF6E8" stroke="#E7D3A8"/>
  <circle cx="210" cy="1740" r="34" fill="#F8E6BE"/>
  <text x="196" y="1747" class="badge">6</text>
  <text x="270" y="1734" class="step-title">Link spatial patterns to patient outcome</text>
  <text x="270" y="1768" class="step-body">Compare patients with short vs. long progression-free survival using Kaplan-Meier,</text>
  <text x="270" y="1792" class="step-body">log-rank testing, and elastic-net Cox regression.</text>
  <text x="270" y="1830" class="step-body">The goal is to identify spatial features associated with prognosis.</text>

  <rect x="760" y="250" width="250" height="72" rx="20" fill="#0F3D3E"/>
  <text x="785" y="296" style="font-family:'Avenir Next','Segoe UI',Arial,sans-serif;font-size:18px;font-weight:700;fill:#FFFFFF;">Big idea</text>
  <text x="785" y="320" style="font-family:'Avenir Next','Segoe UI',Arial,sans-serif;font-size:14px;fill:#DCECE6;">From raw images to clinical meaning</text>
</svg>
